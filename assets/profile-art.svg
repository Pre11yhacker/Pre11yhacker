<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" role="img" aria-label="Anime portrait in a sakura field under bright sun">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4ab0ff"/>
      <stop offset="45%" stop-color="#78d0ff"/>
      <stop offset="100%" stop-color="#dfeeff"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf5" stop-opacity="1"/>
      <stop offset="18%" stop-color="#fff6bf" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#fff5be" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#fff5be" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sakura" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#fefafc"/>
      <stop offset="100%" stop-color="#ffe5f2"/>
    </linearGradient>
    <linearGradient id="cloak" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#9e978f"/>
      <stop offset="28%" stop-color="#d0c9c5"/>
      <stop offset="60%" stop-color="#5b5a61"/>
      <stop offset="100%" stop-color="#1b2137"/>
